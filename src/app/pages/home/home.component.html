<main class="home-page">
  <section id="hero" class="hero">
    <video
      class="hero-video"
      autoplay
      [muted]="true"
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
      tabindex="-1"
    >
      <source src="/assets/images/videos/Homebg.webm" type="video/webm" />
    </video>
    <div class="hero-overlay" aria-hidden="true"></div>

    <div class="hero-copy">
      <h1>{{ title | translate }}</h1>
      <h2>{{ subtitle | translate }}</h2>
      <p class="description">{{ 'home.description' | translate }}</p>
      <app-divider />
      <div class="actions">
        <app-button variant="primary" (btnClick)="scrollToSection('about-me')">
          {{ 'home.aboutCta' | translate }}
        </app-button>
        <app-button variant="secondary" (btnClick)="scrollToSection('contacto')">
          {{ 'home.contactCta' | translate }}
        </app-button>
      </div>
    </div>
  </section>
  <app-about-me />
  <app-dots-divider />
  <app-stack />
  <app-dots-divider />
  <app-experience />
  <app-dots-divider />
  <app-projects />
  <app-dots-divider />
  <app-contact />
</main>
