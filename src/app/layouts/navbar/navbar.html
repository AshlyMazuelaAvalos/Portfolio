<header class="navbar-wrapper">
  <nav class="navbar-container">
    <!-- Logo / Identidad -->
    <!-- Bloque Brand / Identidad -->
    <a
      routerLink="/"
      class="inline-flex items-center gap-2.5 no-underline shrink-0 text-[var(--color-slate-50)] hover:opacity-90 transition-opacity"
    >
      <!-- Logo con máscara SVG: se colorea automáticamente con el color del texto del padre -->
      <span
        class="w-9 h-9 shrink-0 bg-current [mask-image:url('/assets/icons/favicon.svg')] [mask-size:contain] [mask-repeat:no-repeat] [mask-position:center]"
        aria-hidden="true"
      ></span>

      <!-- Textos de marca -->
      <div class="flex flex-col gap-0.5 whitespace-nowrap leading-none">
        <span class="text-[0.75rem] font-bold tracking-[0.08em] uppercase"> ASHLY MAZUELA </span>
        <span class="text-[0.625rem] tracking-[0.04em] opacity-80">{{
          'brand.role' | translate
        }}</span>
      </div>
    </a>

      <ul class="nav-links">
      @for (item of navItems; track item.id ?? $index) {
        <li>
          <a
            class="nav-pill inline-flex items-center no-underline"
            [class.active]="activeSection() === item.id"
            [attr.aria-current]="activeSection() === item.id ? 'location' : null"
            [href]="'/#' + item.id"
            (click)="navigateToSection($event, item.id)"
          >
            {{ item.label | translate }}
          </a>
        </li>
      }
    </ul>

    <!-- Acciones Derecha -->
    <div class="nav-actions">
      <!-- DROPDOWN 1: TEMAS -->
      <div class="menu-container">
        <button
          type="button"
          class="icon-btn"
          [class.active]="isThemeMenuOpen()"
          (click)="toggleThemeMenu($event)"
          [title]="'settings.theme' | translate"
        >
          <!-- Ícono Paleta -->
          <svg lucidePalette size="20"></svg>
        </button>

        @if (isThemeMenuOpen()) {
          <div class="dropdown-popover theme-dropdown" (click)="$event.stopPropagation()">
            <!-- Fila 1: Modo Claro/Oscuro -->
            <label class="dropdown-row">
              <span
                class="switch-toggle"
                [class.checked]="themeService.baseTheme() === 'dark'"
                (click)="themeService.toggleBaseTheme()"
              >
                <span class="switch-thumb">
                  @if (themeService.baseTheme() === 'dark') {
                    <svg lucideMoon size="12"></svg>
                  } @else {
                    <svg lucideSun size="12"></svg>
                  }
                </span>
              </span>
              <span class="dropdown-label">
                {{
                  (themeService.baseTheme() === 'dark' ? 'settings.darkMode' : 'settings.lightMode')
                    | translate
                }}
              </span>
            </label>

            <!-- Fila 2: Modo Daltónico -->
            <label class="dropdown-row">
              <span
                class="switch-toggle"
                [class.checked]="themeService.isColorblind()"
                (click)="themeService.toggleColorblind()"
              >
                <span class="switch-thumb">
                  @if (themeService.isColorblind()) {
                    <svg lucideContrast size="12"></svg>
                  } @else {
                    <svg lucideEye size="12"></svg>
                  }
                </span>
              </span>
              <span class="dropdown-label">{{ 'settings.colorBlind' | translate }}</span>
            </label>
          </div>
        }
      </div>

      <!-- DROPDOWN 2: IDIOMA -->
      <div class="menu-container">
        <button
          type="button"
          class="icon-btn"
          [class.active]="isLangMenuOpen()"
          (click)="toggleLangMenu($event)"
          [title]="'settings.language' | translate"
        >
          <!-- Ícono Traducción / Idiomas -->
          <svg lucideLanguages size="20"></svg>
        </button>

        @if (isLangMenuOpen()) {
          <div class="dropdown-popover lang-dropdown" (click)="$event.stopPropagation()">
            <button
              type="button"
              class="lang-option"
              [class.selected]="currentLang() === 'es'"
              (click)="setLanguage('es')"
            >
              <span class="flag-icon">🇨🇱</span>
              <span>{{ 'language.spanish' | translate }}</span>
            </button>
            <button
              type="button"
              class="lang-option"
              [class.selected]="currentLang() === 'en'"
              (click)="setLanguage('en')"
            >
              <span class="flag-icon">🇬🇧</span>
              <span>{{ 'language.english' | translate }}</span>
            </button>
          </div>
        }
      </div>

      <!-- Botón CV -->
      <app-button variant="primary" (btnClick)="downloadCV()">
        {{ 'nav.downloadCv' | translate }}
      </app-button>
    </div>
  </nav>
</header>
